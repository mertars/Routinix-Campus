services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: routinix
      POSTGRES_PASSWORD: routinix
      POSTGRES_DB: routinix_kampus
    ports:
      - "5432:5432"
    volumes:
      - routinix_postgres_data:/var/lib/postgresql/data

volumes:
  routinix_postgres_data:

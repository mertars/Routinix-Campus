name: CI

on:
  pull_request:
  push:
    branches: [main]

# Aynı PR'a art arda push yapılırsa önceki (artık geçersiz) çalışmayı iptal
# eder — CI dakikalarını boşa harcamaz.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Geçici bir Postgres servis container'ı — Neon'a veya yerel Docker'a
    # HİÇ bağımlı değil, her çalıştırma tamamen izole ve tekrarlanabilirdir
    # (bkz. playwright.config.ts'teki not).
    services:
      postgres:
        # ⚠️ Üretimdeki Neon Postgres 18.6 çalışıyor (2026-09-14'te ölçüldü).
        # CI'ın daha eski bir sürümde koşması, üretimde patlayan bir şeyi
        # burada yeşil gösterebilirdi — sürümler eşit tutulur.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: routinix
          POSTGRES_PASSWORD: routinix
          POSTGRES_DB: routinix_kampus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routinix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://routinix:routinix@localhost:5432/routinix_kampus?schema=public
      # Üretimde ASLA kullanılmaz — sadece CI'daki geçici DB için, gerçek bir
      # sırrın burada durmasına gerek yok (bkz. lib/server/env.ts).
      AUTH_SECRET: ci-test-secret-not-for-production-use-0000000000000000000
      SMS_PROVIDER: mock
      # Entegrasyon testleri AYRI bir veritabanında koşar (bkz.
      # lib/server/test-db.ts) — uygulama şeması/tohum verisi kirlenmesin.
      TEST_DATABASE_URL: postgresql://routinix:routinix@localhost:5432/routinix_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma Client üret
        run: npx prisma generate

      - name: Migration'ları uygula
        run: npx prisma migrate deploy

      - name: Demo veriyi tohumla
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Birim testleri (Vitest)
        run: npm run test

      # Entegrasyon testleri GERÇEK bir veritabanına yazar/siler. Ayrı bir DB
      # kullanılır ki uygulamanın şeması ve tohum verisi etkilenmesin —
      # yereldeki docker-compose.test.yml'nin CI karşılığı.
      - name: Entegrasyon veritabanını oluştur
        run: PGPASSWORD=routinix psql -h localhost -U routinix -d routinix_kampus -c 'CREATE DATABASE routinix_test;'

      - name: Entegrasyon şemasını uygula
        run: PRISMA_TARGET=test npx prisma migrate deploy

      - name: Entegrasyon testleri (gerçek veritabanı)
        run: npm run test:int

      - name: Playwright tarayıcısını kur
        run: npx playwright install chromium --with-deps

      - name: Uçtan uca testler (Playwright)
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Test raporlarını yükle (başarısızlıkta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

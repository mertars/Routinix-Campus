# YEREL TEST VERİTABANI — testler ASLA dershane (üretim) veritabanında koşmaz.
#
# ⚠️ Neden var: 2026-09-12 ve 2026-09-14'te test temizliği CANLI veritabanında
# çalıştırıldığı için gerçek veri silindi. Kural yazmak yetmedi; artık
# testlerin bağlanacağı yer FİZİKSEL olarak ayrı.
#
#   npm run test:db:up      → ayağa kaldır
#   npm run test:db:reset   → şemayı sıfırdan kur (migration'ları uygular)
#   npm run test:int        → entegrasyon testlerini çalıştır
#   npm run test:db:down    → kapat (veri silinir, zaten tek kullanımlık)
#
# ⚠️ Üretimdeki Neon Postgres 18.6 çalışıyor (2026-09-14'te ölçüldü) — test
# veritabanı da 18 olmalı, yoksa davranış farkı ve pg_dump sürüm uyuşmazlığı olur.
services:
  routinix-test-db:
    image: postgres:18-alpine
    container_name: routinix-test-db
    environment:
      POSTGRES_USER: routinix
      POSTGRES_PASSWORD: routinix_test
      POSTGRES_DB: routinix_test
    ports:
      # 5433 — yerelde başka bir Postgres varsa (5432) çakışmasın.
      - "5433:5432"
    # Veri KALICI DEĞİL (volume yok): kapanınca her şey gider. Test
    # veritabanının kalıcı olması istenmez, aksine her koşuda temiz olmalı.
    # ⚠️ Postgres 18 imajı veri dizinini DEĞİŞTİRDİ: mount /var/lib/postgresql
    # olmalı (17'de /var/lib/postgresql/data idi) — eski yolla konteyner
    # "incompatible data directory" diyip açılmıyor.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routinix -d routinix_test"]
      interval: 2s
      timeout: 3s
      retries: 30
